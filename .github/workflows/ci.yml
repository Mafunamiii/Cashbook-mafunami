name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install backend and development dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        working-directory: backend
        run: ruff check .
      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .
      - name: Run unit tests
        working-directory: backend
        run: pytest tests --ignore=tests/integration

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: Prettier format check
        working-directory: frontend
        run: npm run format
      - name: Vitest
        working-directory: frontend
        run: npm test
      - name: TypeScript check and production build
        working-directory: frontend
        run: npm run build

  integration:
    name: integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cashbook_integration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cashbook_integration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/cashbook_integration_test
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install backend and development dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Verify isolated test database name
        run: python -c 'from sqlalchemy.engine import make_url; name = make_url("${TEST_DATABASE_URL}").database or ""; assert name.endswith("_test"), name'
      - name: Run PostgreSQL integration tests
        working-directory: backend
        run: pytest tests/integration

  migration:
    name: migration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cashbook_migration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cashbook_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/cashbook_migration_test
      EXPECTED_ALEMBIC_HEAD: 20260811_0010
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install backend and development dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Verify isolated migration database name
        run: python -c 'from sqlalchemy.engine import make_url; name = make_url("${DATABASE_URL}").database or ""; assert name.endswith("_test"), name'
      - name: Apply Alembic migrations to fresh database
        working-directory: backend
        run: alembic upgrade head
      - name: Verify database is at expected Alembic head
        working-directory: backend
        run: alembic current | grep -F "${EXPECTED_ALEMBIC_HEAD} (head)"
