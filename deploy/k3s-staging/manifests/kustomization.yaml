apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: namicash-staging
resources:
  - namespace.yaml
  - configmap.yaml
  - postgresql.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml

# Replace the example registry paths and tags before applying. This overlay
# uses already-built frontend/backend images; it does not build images.
images:
  - name: namicash-backend
    newName: REGISTRY.example.com/namicash/backend
    newTag: IMAGE_TAG
  - name: namicash-frontend
    newName: REGISTRY.example.com/namicash/frontend
    newTag: IMAGE_TAG
