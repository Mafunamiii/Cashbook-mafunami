apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      containers:
        - name: backend
          image: namicash-backend:staging
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: namicash-staging-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: namicash-staging-secrets
                  key: DATABASE_URL
            - name: INITIAL_INVITE_CODE
              valueFrom:
                secretKeyRef:
                  name: namicash-staging-secrets
                  key: INITIAL_INVITE_CODE
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
