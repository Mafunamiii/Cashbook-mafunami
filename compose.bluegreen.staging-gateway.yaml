# Isolated test Caddy. No production network or production port.
services:
  caddy:
    image: caddy:2
    ports:
      - "127.0.0.1:18091:8091"
    volumes:
      - ${BG_CADDYFILE:?required}:/etc/caddy/Caddyfile:ro
      - ${BG_MANAGED_DIR:?required}:/etc/caddy/managed:ro
    networks:
      gateway: {}
    mem_limit: 128m
    pids_limit: 128
networks:
  gateway:
    external: true
    name: namicash-bg-stage-gateway
